<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Surrender Flow Strategy | Journal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css?v=20260925d" rel="stylesheet">
</head>

<body class="page-app">
    <div class="site-page-wrap">
        <div class="site-card">
            <div class="site-accent"></div>
            <header class="site-header">
                <div class="site-header-top">
                    <div>
                        <div class="site-brand">Surrender Flow Strategy</div>
                        <div class="site-subtitle">Trading Journal</div>
                        <div class="site-badge-wrap">
                            <span class="site-badge">Notes and reflections</span>
                        </div>
                    </div>
                    <nav class="navbar navbar-expand-lg navbar-dark site-nav p-0">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                            aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav ms-auto">
                                <li class="nav-item"><a class="nav-link" href="index.html">Setups</a></li>
                                <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                                <li class="nav-item"><a class="nav-link active" href="journal.html">Journal</a></li>
                                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                            </ul>
                        </div>
                    </nav>
                </div>
            </header>
            <div class="site-meta">
                Capture trade thoughts, process notes, and post-session reflections.
            </div>

            <div class="site-body">
                <div class="journal-composer mb-4">
                    <input class="form-control mb-2" id="journalHeader" placeholder="Header" maxlength="200">
                    <textarea class="form-control mb-1" id="journalBody" rows="5" maxlength="500"
                        placeholder="Journal entry..."></textarea>
                    <div class="text-end text-muted small"><span id="charCount">0</span>/500</div>
                    <button class="btn btn-site-primary w-100 mt-2" type="button" onclick="addJournalEntry()">Submit</button>
                </div>

                <div class="loader-container" id="getStockSetupsLoader" style="display: none;">
                    <div class="loader"></div>
                </div>

                <div id="journalEntries"></div>

                <button class="btn btn-site-outline w-100 mt-3" id="loadMoreBtn" type="button"
                    onclick="loadMoreEntries()">Load More</button>
            </div>

            <footer class="site-footer">
                &copy; <span id="getCurrentYear"></span> Surrender Flow Strategy
            </footer>
        </div>
    </div>

    <button class="back-to-top btn btn-success d-none" id="backToTop" type="button">Back to Top</button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js?v=20260925d"></script>
    <script src="js/journal.js?v=20260925d"></script>
    <script>document.getElementById('getCurrentYear').textContent = new Date().getFullYear();</script>
</body>

</html>
