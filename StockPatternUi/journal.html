<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Surrender Flow Strategy | Journal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@300..900&display=swap" rel="stylesheet">
    <link href="css/styles.css?v=20260925c" rel="stylesheet">
    <style>
        .container {
            max-width: 945px;
        }

        .mainTitle {
            font-size: 2.5rem;
        }

        textarea {
            font-size: 0.95rem;
        }

        .navbar {
            padding: 0.5rem 1rem;
        }

        .nav-link {
            padding: 0.4rem 0.8rem;
            font-size: 0.95rem;
        }

        #journalEntries .card {
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container py-5">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Surrender Flow Strategy</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Setups</a></li>
                        <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                        <li class="nav-item"><a class="nav-link active" href="journal.html">Journal</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <h1 class="mainTitle mb-3 text-center">You are what you are and you are where you are.</h1>

        <div class="mb-3">
            <input class="form-control mb-2" id="journalHeader" placeholder="Header">
            <textarea class="form-control mb-1" id="journalBody" rows="5" maxlength="500"
                placeholder="Journal entry..."></textarea>
            <div class="text-end text-muted small"><span id="charCount">0</span>/500</div>
            <button class="btn btn-success w-100 mt-2" onclick="addJournalEntry()">Submit</button>
        </div>

        <hr>

        <div id="journalEntries" class="mt-3"></div>

        <button class="btn btn-outline-success w-100 mt-3" id="loadMoreBtn" onclick="loadMoreEntries()">Load
            More</button>

        <button class="btn btn-success position-fixed bottom-0 end-0 m-3" id="backToTop"
            style="display:none;">↑</button>

        <footer class="text-center text-muted small mt-5">
            &copy; <span id="getCurrentYear"></span> Surrender Flow Strategy
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js?v=20260925c"></script>
    <script src="js/journal.js?v=20260925c"></script>
    <script>document.getElementById('getCurrentYear').textContent = new Date().getFullYear();</script>
</body>

</html>
